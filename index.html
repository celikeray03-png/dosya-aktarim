<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Dosya ve Metin Transferi</title>
    <!-- Favicon: Inline SVG Transfer İkonu -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M17 3L21 7L17 11'/%3E%3Cpath d='M3 7H21'/%3E%3Cpath d='M7 21L3 17L7 13'/%3E%3Cpath d='M21 17H3'/%3E%3C/svg%3E">
    
    <!-- PeerJS & QR Code CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --inner-card: #f8fafc;
            --input-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --code-bg: #eef2ff;
            --drop-hover: #eef2ff;
            --btn-sec-bg: #e2e8f0;
            --btn-sec-hover: #cbd5e1;
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --inner-card: #0f172a;
            --input-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --code-bg: rgba(99, 102, 241, 0.15);
            --drop-hover: rgba(99, 102, 241, 0.1);
            --btn-sec-bg: #334155;
            --btn-sec-hover: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            padding: 28px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--inner-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            color: var(--text);
            border-color: var(--primary);
            background: var(--inner-card);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 0 28px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background: var(--inner-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: background-color 0.2s, border-color 0.2s;
        }

        .my-code-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .code-display {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--primary);
            background: var(--code-bg);
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px dashed var(--primary);
        }

        #qrcode {
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .rich-editor {
            width: 100%;
            min-height: 90px;
            max-height: 200px;
            overflow-y: auto;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            word-break: break-word;
            line-height: 1.5;
        }

        .rich-editor:focus {
            border-color: var(--primary);
        }

        .rich-editor:empty::before {
            content: attr(data-placeholder);
            color: var(--text-muted);
            pointer-events: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--btn-sec-bg);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--btn-sec-hover);
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background-color: var(--drop-hover);
        }

        .drop-zone svg {
            width: 36px;
            height: 36px;
            stroke: var(--text-muted);
        }

        .drop-zone p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .drop-zone span {
            color: var(--primary);
            font-weight: 600;
        }

        #fileInput {
            display: none;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
        }

        .status-dot.connected {
            background-color: var(--success);
        }

        .progress-container {
            margin-top: 12px;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.1s linear;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .received-text-box {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .hidden {
            display: none !important;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tema Değiştirme Butonu -->
        <button id="themeToggle" class="theme-toggle" title="Temayı Değiştir" aria-label="Temayı Değiştir">
            <svg id="moonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="sunIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>

        <div class="header">
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3L21 7L17 11"/><path d="M3 7H21"/><path d="M7 21L3 17L7 13"/><path d="M21 17H3"/></svg>
                Dosya ve Metin Transferi
            </h1>
            <p>Aynı ağdaki cihazlar arası direkt aktarım</p>
        </div>

        <div class="status">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Ağ bağlantısı bekleniyor...</span>
        </div>

        <!-- 1. Kendi Kodun / QR Kod -->
        <div class="card my-code-section">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Bu Cihazın Kodu</span>
            <div id="myCode" class="code-display">----</div>
            <div id="qrcode"></div>
        </div>

        <!-- 2. Bağlanma Alanı -->
        <div id="connectSection" class="card">
            <span style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 8px;">Karşı Cihaza Bağlan</span>
            <div class="input-group">
                <input type="text" id="targetIdInput" placeholder="Kodu girin (örn. 4K9L)" maxlength="4">
                <button id="connectBtn">Bağlan</button>
            </div>
        </div>

        <!-- 3. Transfer Alanı (Bağlanınca Görünür) -->
        <div id="transferSection" class="hidden">
            
            <!-- Dosya Gönderme -->
            <div class="drop-zone" id="dropZone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <p>Dosyayı buraya sürükleyin veya <span>seçin</span></p>
                <input type="file" id="fileInput">
            </div>

            <!-- Metin Gönderme (Biçim Korumalı) -->
            <div class="card" style="margin-bottom: 16px;">
                <span style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 8px;">Metin / Link Gönder (Biçim Korumalı)</span>
                <div id="textToSend" class="rich-editor" contenteditable="true" data-placeholder="Biçimli metni buraya yapıştırın veya yazın..."></div>
                <button id="sendTextBtn" style="width: 100%; margin-top: 8px;">Metni Gönder</button>
            </div>

            <!-- Gelen Metin Kutusu -->
            <div id="receivedTextCard" class="card hidden">
                <span style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 8px;">Gelen Metin</span>
                <div id="receivedText" class="received-text-box"></div>
                <button id="copyTextBtn" class="btn-secondary" style="width: 100%;">Biçimiyle Kopyala</button>
            </div>

            <!-- İlerleme Çubuğu -->
            <div id="progressContainer" class="progress-container">
                <div class="progress-info">
                    <span id="progressStatus">Gönderiliyor...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>

        </div>

        <div class="footer">
            Uçtan uca şifreli • Veriler sunucuya yüklenmez (P2P)
        </div>
    </div>

    <script>
        // Tema Yönetimi
        const themeToggle = document.getElementById('themeToggle');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                moonIcon.classList.add('hidden');
                sunIcon.classList.remove('hidden');
            } else {
                document.documentElement.removeAttribute('data-theme');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
            localStorage.setItem('transfer-theme', theme);
        }

        const savedTheme = localStorage.getItem('transfer-theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(savedTheme);

        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        function generateShortId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        const CHUNK_SIZE = 16384;
        let peer = null;
        let conn = null;
        let myId = generateShortId();

        const myCodeEl = document.getElementById('myCode');
        const qrcodeEl = document.getElementById('qrcode');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const targetIdInput = document.getElementById('targetIdInput');
        const connectBtn = document.getElementById('connectBtn');
        const connectSection = document.getElementById('connectSection');
        const transferSection = document.getElementById('transferSection');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressStatus = document.getElementById('progressStatus');
        
        const textToSend = document.getElementById('textToSend');
        const sendTextBtn = document.getElementById('sendTextBtn');
        const receivedTextCard = document.getElementById('receivedTextCard');
        const receivedText = document.getElementById('receivedText');
        const copyTextBtn = document.getElementById('copyTextBtn');

        const urlParams = new URLSearchParams(window.location.search);
        const autoConnectId = urlParams.get('connect');

        function initPeer() {
            peer = new Peer(myId, { debug: 1 });

            peer.on('open', (id) => {
                myCodeEl.textContent = id;
                statusText.textContent = 'Bağlantıya hazır';
                
                const currentUrl = window.location.href.split('?')[0];
                qrcodeEl.innerHTML = '';
                new QRCode(qrcodeEl, {
                    text: `${currentUrl}?connect=${id}`,
                    width: 128,
                    height: 128,
                    correctLevel: QRCode.CorrectLevel.L
                });

                if (autoConnectId && autoConnectId !== id) {
                    targetIdInput.value = autoConnectId;
                    connectToPeer(autoConnectId);
                }
            });

            peer.on('connection', (incomingConn) => {
                setupConnection(incomingConn);
            });

            peer.on('error', (err) => {
                console.error(err);
                statusText.textContent = 'Hata oluştu. Yeniden deneniyor...';
            });
        }

        function connectToPeer(targetId) {
            statusText.textContent = 'Bağlanılıyor...';
            const outgoingConn = peer.connect(targetId.toUpperCase());
            setupConnection(outgoingConn);
        }

        function setupConnection(connection) {
            conn = connection;

            conn.on('open', () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Cihaz bağlandı!';
                connectSection.classList.add('hidden');
                transferSection.classList.remove('hidden');
            });

            let incomingFileInfo = null;
            let receivedBytes = 0;
            let receiveBuffer = [];

            conn.on('data', (data) => {
                if (data.type === 'text') {
                    receivedTextCard.classList.remove('hidden');
                    if (data.html) {
                        receivedText.innerHTML = data.html;
                    } else {
                        receivedText.textContent = data.content;
                    }
                    copyTextBtn.textContent = 'Biçimiyle Kopyala';
                    return;
                }

                if (data.type === 'header') {
                    incomingFileInfo = data;
                    receivedBytes = 0;
                    receiveBuffer = [];
                    progressContainer.style.display = 'block';
                    progressStatus.textContent = `Alınıyor: ${data.name}`;
                    return;
                }

                if (data.type === 'chunk') {
                    receiveBuffer.push(data.chunk);
                    receivedBytes += data.chunk.byteLength;

                    let pct = Math.floor((receivedBytes / incomingFileInfo.size) * 100);
                    progressBar.style.width = pct + '%';
                    progressPercent.textContent = pct + '%';

                    if (receivedBytes === incomingFileInfo.size) {
                        const blob = new Blob(receiveBuffer, { type: incomingFileInfo.fileType });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = incomingFileInfo.name;
                        a.click();

                        progressStatus.textContent = 'İndirme tamamlandı!';
                        setTimeout(() => {
                            progressContainer.style.display = 'none';
                            progressBar.style.width = '0%';
                        }, 3000);
                    }
                }
            });

            conn.on('close', () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Bağlantı kesildi.';
                connectSection.classList.remove('hidden');
                transferSection.classList.add('hidden');
            });
        }

        sendTextBtn.addEventListener('click', () => {
            const plainText = textToSend.innerText.trim();
            const htmlContent = textToSend.innerHTML.trim();
            if (plainText && conn && conn.open) {
                conn.send({
                    type: 'text',
                    content: plainText,
                    html: htmlContent
                });
                textToSend.innerHTML = '';
            }
        });

        copyTextBtn.addEventListener('click', async () => {
            const html = receivedText.innerHTML;
            const text = receivedText.innerText;
            if (!text) return;

            try {
                const htmlBlob = new Blob([html], { type: 'text/html' });
                const textBlob = new Blob([text], { type: 'text/plain' });
                const clipboardItem = new ClipboardItem({
                    'text/html': htmlBlob,
                    'text/plain': textBlob
                });
                await navigator.clipboard.write([clipboardItem]);
                showCopiedFeedback();
            } catch (err) {
                const range = document.createRange();
                range.selectNodeContents(receivedText);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                document.execCommand('copy');
                selection.removeAllRanges();
                showCopiedFeedback();
            }
        });

        function showCopiedFeedback() {
            copyTextBtn.textContent = 'Biçimiyle Kopyalandı! ✓';
            setTimeout(() => {
                copyTextBtn.textContent = 'Biçimiyle Kopyala';
            }, 2000);
        }

        function sendFile(file) {
            if (!conn || !conn.open) return;

            progressContainer.style.display = 'block';
            progressStatus.textContent = `Gönderiliyor: ${file.name}`;

            conn.send({
                type: 'header',
                name: file.name,
                size: file.size,
                fileType: file.type
            });

            let offset = 0;
            const reader = new FileReader();

            reader.onload = (e) => {
                conn.send({
                    type: 'chunk',
                    chunk: e.target.result
                });

                offset += e.target.result.byteLength;
                let pct = Math.floor((offset / file.size) * 100);
                progressBar.style.width = pct + '%';
                progressPercent.textContent = pct + '%';

                if (offset < file.size) {
                    readNextChunk();
                } else {
                    progressStatus.textContent = 'Gönderim tamamlandı!';
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        progressBar.style.width = '0%';
                    }, 3000);
                }
            };

            function readNextChunk() {
                const slice = file.slice(offset, offset + CHUNK_SIZE);
                reader.readAsArrayBuffer(slice);
            }

            readNextChunk();
        }

        connectBtn.addEventListener('click', () => {
            const code = targetIdInput.value.trim();
            if (code) connectToPeer(code);
        });

        targetIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const code = targetIdInput.value.trim();
                if (code) connectToPeer(code);
            }
        });

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                sendFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                sendFile(e.dataTransfer.files[0]);
            }
        });

        initPeer();
    </script>
</body>
</html>
