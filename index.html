<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Dosya Transferi</title>
    <!-- Favicon: Inline SVG Transfer İkonu -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M17 3L21 7L17 11'/%3E%3Cpath d='M3 7H21'/%3E%3Cpath d='M7 21L3 17L7 13'/%3E%3Cpath d='M21 17H3'/%3E%3C/svg%3E">
    
    <!-- PeerJS & QR Code CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
            padding: 28px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .card {
            background: var(--bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .my-code-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .code-display {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--primary);
            background: #eef2ff;
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px dashed var(--primary);
        }

        #qrcode {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            text-transform: uppercase;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background-color: #eef2ff;
        }

        .drop-zone svg {
            width: 40px;
            height: 40px;
            stroke: var(--text-muted);
        }

        .drop-zone p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .drop-zone span {
            color: var(--primary);
            font-weight: 600;
        }

        #fileInput {
            display: none;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
        }

        .status-dot.connected {
            background-color: var(--success);
        }

        .progress-container {
            margin-top: 16px;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.1s linear;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .hidden {
            display: none !important;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3L21 7L17 11"/><path d="M3 7H21"/><path d="M7 21L3 17L7 13"/><path d="M21 17H3"/></svg>
                Dosya Transferi
            </h1>
            <p>Aynı ağdaki cihazlar arası direkt aktarım</p>
        </div>

        <div class="status">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Ağ bağlantısı bekleniyor...</span>
        </div>

        <!-- 1. Kendi Kodun / QR Kod -->
        <div class="card my-code-section">
            <span style="font-size: 0.85rem; color: var(--text-muted);">Bu Cihazın Kodu</span>
            <div id="myCode" class="code-display">----</div>
            <div id="qrcode"></div>
        </div>

        <!-- 2. Bağlanma Alanı -->
        <div id="connectSection" class="card">
            <span style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 8px;">Karşı Cihaza Bağlan</span>
            <div class="input-group">
                <input type="text" id="targetIdInput" placeholder="Kodu girin (örn. 4K9L)" maxlength="4">
                <button id="connectBtn">Bağlan</button>
            </div>
        </div>

        <!-- 3. Dosya Gönderme Alanı -->
        <div id="transferSection" class="hidden">
            <div class="drop-zone" id="dropZone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <p>Dosyayı buraya sürükleyin veya <span>seçin</span></p>
                <input type="file" id="fileInput">
            </div>

            <div id="progressContainer" class="progress-container">
                <div class="progress-info">
                    <span id="progressStatus">Gönderiliyor...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            Uçtan uca şifreli • Veriler sunucuya yüklenmez (P2P)
        </div>
    </div>

    <script>
        // Rastgele 4 karakterli kısa kod üretici
        function generateShortId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 4; i++) {
                result += chars.charAt(floor(Math.random() * chars.length));
            }
            return result;
        }

        const CHUNK_SIZE = 16384; // 16KB parçalar halinde veri iletimi
        let peer = null;
        let conn = null;
        let myId = generateShortId();

        // DOM Elemanları
        const myCodeEl = document.getElementById('myCode');
        const qrcodeEl = document.getElementById('qrcode');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const targetIdInput = document.getElementById('targetIdInput');
        const connectBtn = document.getElementById('connectBtn');
        const connectSection = document.getElementById('connectSection');
        const transferSection = document.getElementById('transferSection');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressStatus = document.getElementById('progressStatus');

        // URL'den bağ parametresi kontrolü (QR Okutma için)
        const urlParams = new URLSearchParams(window.location.search);
        const autoConnectId = urlParams.get('connect');

        // PeerJS Başlatma
        function initPeer() {
            peer = new Peer(myId, {
                debug: 1
            });

            peer.on('open', (id) => {
                myCodeEl.textContent = id;
                statusText.textContent = 'Bağlantıya hazır';
                
                // QR Kod Oluştur
                const currentUrl = window.location.href.split('?')[0];
                qrcodeEl.innerHTML = '';
                new QRCode(qrcodeEl, {
                    text: `${currentUrl}?connect=${id}`,
                    width: 128,
                    height: 128,
                    correctLevel: QRCode.CorrectLevel.L
                });

                // Otomatik Bağlantı İsteği Varsa
                if (autoConnectId && autoConnectId !== id) {
                    targetIdInput.value = autoConnectId;
                    connectToPeer(autoConnectId);
                }
            });

            peer.on('connection', (incomingConn) => {
                setupConnection(incomingConn);
            });

            peer.on('error', (err) => {
                console.error(err);
                statusText.textContent = 'Hata oluştu. Yeniden deneniyor...';
            });
        }

        // Karşı tarafa bağlan
        function connectToPeer(targetId) {
            statusText.textContent = 'Bağlanılıyor...';
            const outgoingConn = peer.connect(targetId.toUpperCase());
            setupConnection(outgoingConn);
        }

        // Bağlantı Dinleyicileri
        function setupConnection(connection) {
            conn = connection;

            conn.on('open', () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Cihaz bağlandı!';
                connectSection.classList.add('hidden');
                transferSection.classList.remove('hidden');
            });

            let incomingFileInfo = null;
            let receivedBytes = 0;
            let receiveBuffer = [];

            conn.on('data', (data) => {
                // Metalink / Başlık Verisi Geldiğinde
                if (data.type === 'header') {
                    incomingFileInfo = data;
                    receivedBytes = 0;
                    receiveBuffer = [];
                    progressContainer.style.display = 'block';
                    progressStatus.textContent = `Alınıyor: ${data.name}`;
                    return;
                }

                // Parça Verisi Geldiğinde
                if (data.type === 'chunk') {
                    receiveBuffer.push(data.chunk);
                    receivedBytes += data.chunk.byteLength;

                    let pct = Math.floor((receivedBytes / incomingFileInfo.size) * 100);
                    progressBar.style.width = pct + '%';
                    progressPercent.textContent = pct + '%';

                    if (receivedBytes === incomingFileInfo.size) {
                        // Dosya tamamlandı, otomatik indir
                        const blob = new Blob(receiveBuffer, { type: incomingFileInfo.fileType });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = incomingFileInfo.name;
                        a.click();

                        progressStatus.textContent = 'İndirme tamamlandı!';
                        setTimeout(() => {
                            progressContainer.style.display = 'none';
                            progressBar.style.width = '0%';
                        }, 3000);
                    }
                }
            });

            conn.on('close', () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Bağlantı kesildi.';
                connectSection.classList.remove('hidden');
                transferSection.classList.add('hidden');
            });
        }

        // Dosya Gönderme İşlemi
        function sendFile(file) {
            if (!conn || !conn.open) return;

            progressContainer.style.display = 'block';
            progressStatus.textContent = `Gönderiliyor: ${file.name}`;

            // 1. Dosya Başlığını Gönder
            conn.send({
                type: 'header',
                name: file.name,
                size: file.size,
                fileType: file.type
            });

            // 2. Dosya Parçalarını Gönder
            let offset = 0;
            const reader = new FileReader();

            reader.onload = (e) => {
                conn.send({
                    type: 'chunk',
                    chunk: e.target.result
                });

                offset += e.target.result.byteLength;
                let pct = Math.floor((offset / file.size) * 100);
                progressBar.style.width = pct + '%';
                progressPercent.textContent = pct + '%';

                if (offset < file.size) {
                    readNextChunk();
                } else {
                    progressStatus.textContent = 'Gönderim tamamlandı!';
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        progressBar.style.width = '0%';
                    }, 3000);
                }
            };

            function readNextChunk() {
                const slice = file.slice(offset, offset + CHUNK_SIZE);
                reader.readAsArrayBuffer(slice);
            }

            readNextChunk();
        }

        // Event Listener'lar
        connectBtn.addEventListener('click', () => {
            const code = targetIdInput.value.trim();
            if (code) connectToPeer(code);
        });

        targetIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const code = targetIdInput.value.trim();
                if (code) connectToPeer(code);
            }
        });

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                sendFile(e.target.files[0]);
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                sendFile(e.dataTransfer.files[0]);
            }
        });

        // Uygulamayı Başlat
        initPeer();
    </script>
</body>
</html>
